services:
  db:
    image: supabase/postgres:17.6.1.143
    container_name: pi-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data # data survives container restarts
      - ./migrations:/migrations:ro # schema files visible inside, read-only
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:12.3.1
    container_name: pi-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres} # for datasource provisioning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      db:
        condition: service_healthy

  auth:
    image: supabase/gotrue:v2.180.0
    container_name: pi-auth
    ports:
      - "9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:8501
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_MAILER_AUTOCONFIRM: "true" # no SMTP locally -> skip email confirmation
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: pi-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      # .dockerignore keeps .env out of the image, so settings reach the app
      # only through here — a value set in .env alone would be ignored.
      MONTHLY_QUESTION_LIMIT: ${MONTHLY_QUESTION_LIMIT:-500}
    volumes:
      - ./data:/app/data # uploads persist to host, shared with the airflow ingester
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: pi-ui
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000    # server-side calls use compose service names
      AUTH_URL: http://auth:9999
    depends_on:
      - api

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    container_name: pi-airflow
    # /opt/airflow is a persistent volume, so the webserver's PID file outlives
    # the container. On restart Airflow reads it, concludes a webserver is
    # already running, waits 120s for a gunicorn master that doesn't exist, and
    # shuts the webserver down -- leaving the scheduler up and port 8080 dead.
    # Clearing it first is safe: nothing can be running if we're starting.
    command: bash -c "rm -f /opt/airflow/airflow-webserver.pid && exec airflow standalone"
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      PYTHONPATH: /opt/airflow/project
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
    volumes:
      - ./dags:/opt/airflow/project/dags
      - ./ingestion:/opt/airflow/project/ingestion
      - ./common:/opt/airflow/project/common
      - ./data:/opt/airflow/project/data
      - airflow_data:/opt/airflow
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  airflow_data:
